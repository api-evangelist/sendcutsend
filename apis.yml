aid: sendcutsend
name: SendCutSend
description: 'SendCutSend is a rapid custom manufacturing service offering online sheet metal
  fabrication, laser cutting, waterjet cutting, CNC machining, CNC bending, tapping, hardware
  installation, and finishing across 175+ materials, with instant online pricing from uploaded
  STEP or DXF files and parts delivered in as little as a few days. Customers quote, configure,
  and order parts through the app.sendcutsend.com web application. The company reached a $1.01B
  valuation following a $110M investment co-led by Sequoia, Paradigm, and Patrick and John Collison.
  SendCutSend does not currently publish a public developer API; this profile captures its public
  web, pricing, and content surface for the API Evangelist network.'
